name: Backend ve sözleşme doğrulaması

on:
  push:
    branches:
      - 'codex/**'
      - main
  pull_request:

jobs:
  standalone-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Düz PostgreSQL test bağımlılıkları
        run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-16-pgtap postgresql-16-cron
      - name: Docker'sız yapısal shim ve eşzamanlılık testi
        run: sudo env PG_BIN=/usr/lib/postgresql/16/bin bash scripts/db-test.sh

  supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Supabase CLI kur
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Deno kur
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: API tip ve birim testleri
        run: |
          deno check --config backend/supabase/functions/deno.json backend/supabase/functions/api/index.ts scripts/api-smoke.ts scripts/dispatcher-smoke.ts
          deno test --allow-read --config backend/supabase/functions/deno.json backend/supabase/functions/tests/

      - name: OpenAPI doğrula
        run: npx --yes @redocly/cli@2.59.0 lint contracts/openapi.yaml

      - name: Ses fixture aracı kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Yerel Supabase yığınını başlat
        run: supabase start --workdir backend

      - name: Veritabanını migration'lardan kur
        run: supabase db reset --workdir backend

      - name: pgTAP testlerini çalıştır
        run: supabase test db --workdir backend

      - name: Eşzamanlılık testini çalıştır
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash scripts/concurrency-test.sh

      - name: Sürüm ve altyapı kanıtlarını yaz
        env:
          PGPASSWORD: postgres
        run: |
          supabase --version
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c 'select version();'
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c "select extversion from pg_extension where extname = 'pgmq';"
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c 'select jobname, schedule from cron.job;'
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c 'select * from pgmq.list_queues();'

      - name: Gerçek Auth Storage API dispatcher webhook smoke testi
        run: bash scripts/api-smoke.sh
